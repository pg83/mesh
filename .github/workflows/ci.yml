name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The lab puts every node in its own network namespace and wires them
      # with TUN devices, so it needs unprivileged user namespaces, which
      # Ubuntu confines by default, and the tun module.
      - name: Install application test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-client openssh-server rsync curl iperf3 iproute2 util-linux openssl
          echo /usr/sbin >> "$GITHUB_PATH"
          echo "MESH_TEST_ARTIFACTS=$RUNNER_TEMP/mesh-artifacts" >> "$GITHUB_ENV"

      - name: Install browser for web e2e
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install playwright==1.58.0
          "$RUNNER_TEMP/browser/bin/playwright" install --with-deps chromium
          echo "MESH_TEST_BROWSER_PYTHON=$RUNNER_TEMP/browser/bin/python" >> "$GITHUB_ENV"

      - name: Prepare namespaces and tun
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe tun
          ls -l /dev/net/tun
          unshare -rUn true && echo "user namespaces ok"

      - name: Format
        run: test -z "$(gofmt -l *.go)" || { gofmt -d *.go; exit 1; }

      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=readonly

      - name: Build and test
        run: ./build -k -j 4 test

      - name: Save web screenshot and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-test-failure
          path: ${{ runner.temp }}/mesh-artifacts
          retention-days: 7

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install application test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc openssh-client openssh-server rsync curl iperf3 iproute2 util-linux openssl
          echo /usr/sbin >> "$GITHUB_PATH"
          echo "MESH_TEST_ARTIFACTS=$RUNNER_TEMP/mesh-artifacts" >> "$GITHUB_ENV"

      - name: Prepare namespaces and tun
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe tun

      - name: Run all e2e tests with the race detector
        run: ./build -k -j 2 -Drace test

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-race-failure
          path: ${{ runner.temp }}/mesh-artifacts
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install application test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-client openssh-server rsync curl iperf3 iproute2 util-linux openssl
          echo /usr/sbin >> "$GITHUB_PATH"
          echo "MESH_TEST_ARTIFACTS=$RUNNER_TEMP/mesh-artifacts" >> "$GITHUB_ENV"

      - name: Prepare namespaces and tun
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe tun

      - name: Run the tests against the instrumented binary
        run: ./build -k -j 4 -Dcoverage coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.build/coverage.out') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .build/coverage.out
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-coverage-failure
          path: ${{ runner.temp }}/mesh-artifacts
          retention-days: 7

  darwin:
    name: Darwin utun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native mesh and echo peer
        run: |
          go build -trimpath -o .build/bin/mesh .
          go build -trimpath -tags=meshprobe -o .build/bin/mesh-probe .
          go vet ./...
      - name: Test native utun and encrypted packet round trips
        run: sudo "$(command -v python3)" tst/darwin.py
      - name: Save native binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-${{ matrix.os }}
          path: .build/bin/mesh
          retention-days: 7
